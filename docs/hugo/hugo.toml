baseURL = "/"
title = "qcc docs"
# Makes the generated site plain double-click-and-browse friendly: links resolve relative to the
# current page and point at real *.html files, so it works straight off disk via file:// with no
# web server involved.
relativeURLs = true
uglyURLs = true

# mlir-tblgen emits the attribute tables as raw HTML (a `<details>` block per attribute, which a markdown
# table cell cannot hold), so goldmark has to pass HTML through instead of dropping it.
[markup.goldmark.renderer]
unsafe = true
